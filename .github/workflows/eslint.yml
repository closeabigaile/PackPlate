# Lint check for proj_2/frontend (settings in eslint.config.mjs).
name: ESLint

on:
  push:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/eslint.yml"
  pull_request:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/eslint.yml"

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj_2/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proj_2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run lint
