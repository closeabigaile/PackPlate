# Formatting check for proj_2/frontend (settings in .prettierrc).
name: Prettier

on:
  push:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/prettier.yml"
  pull_request:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/prettier.yml"

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj_2/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proj_2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run format:check
