# Daily scrape of NC State dining into the shared Supabase database (#3).
# NC State Dining allows scraping at most once or twice a day, so this runs once.
#
# GitHub only runs scheduled (and manually started) workflows from the default
# branch, so this starts working once dev is merged into main.
# Needs the repo secret SUPABASE_URL (the database URL, never in this file).
#
# After each run it checks for problems (python -m ingestion.scrape_alerts) and
# opens a GitHub issue per kind of alert, or comments on the open one. Review
# alerts are a count only: the repo is public, so dish names never go in issues.
name: Daily scrape

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 4am EST / 5am EDT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and alert
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: proj_2
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proj_2/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        run: python -m ingestion.run

      - name: Open or update alert issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ingestion.scrape_alerts > alerts.json
          jq -c '.[]' alerts.json | while read -r alert; do
            title=$(jq -r .title <<< "$alert")
            body=$(jq -r .body <<< "$alert")
            number=$(gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done

      - name: Mark the workflow failed if the scrape failed
        if: ${{ steps.scrape.outcome == 'failure' }}
        run: exit 1
