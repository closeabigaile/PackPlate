# Runs the application test suites on every push and pull request.
# Project 3 M0 runs separately; inherited evaluation suites are historical.
# Versions match docker-compose.yml and the Dockerfiles (Postgres 16, Python 3.12, Node 22).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend and ingestion tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packplate
          POSTGRES_PASSWORD: packplate
          POSTGRES_DB: packplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The tests create this database if missing (see the conftest files).
      TEST_DATABASE_URL: postgresql://packplate:packplate@localhost:5432/packplate_test
      # Fail, don't skip, if the database tests can't reach Postgres.
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            proj_3/requirements-dev.txt
            proj_3/backend/requirements.txt
            proj_3/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r proj_3/requirements-dev.txt

      - name: Backend tests
        working-directory: proj_3/backend
        run: >-
          pytest --cov=app --cov-config=../pyproject.toml
          --junitxml="$GITHUB_WORKSPACE/test-results/backend.xml"
          --cov-report=xml:"$GITHUB_WORKSPACE/coverage/backend.xml"

      - name: Ingestion tests
        # Run even if the backend failed, so the badge counts both suites.
        if: ${{ !cancelled() }}
        working-directory: proj_3
        run: >-
          pytest ingestion --cov=ingestion --cov=db --cov-config=pyproject.toml
          --junitxml="$GITHUB_WORKSPACE/test-results/ingestion.xml"
          --cov-report=xml:"$GITHUB_WORKSPACE/coverage/ingestion.xml"

      # docs/reference.md and docs/api.md are generated from the code.
      - name: Generated docs are up to date
        if: ${{ !cancelled() }}
        working-directory: proj_3
        run: python docs/generate.py --check

      # Retain the source measurements even when a test or external upload fails.
      - name: Save Python test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            coverage/
          if-no-files-found: error
          retention-days: 30

      # Coverage badge: Codecov reads the two reports. A Codecov outage only
      # skips the upload; it never fails the tests.
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/backend.xml,coverage/ingestion.xml
          disable_search: true
          fail_ci_if_error: false

      # Test-count badge: only pushes to dev update it, so feature branches
      # don't overwrite the number. The JSON lives in a gist that shields.io reads.
      - name: Count tests
        id: count
        if: ${{ !cancelled() }}
        # Explicit bash adds pipefail, so a script error isn't hidden by tee.
        shell: bash
        run: >-
          python .github/scripts/test_badge.py
          test-results/backend.xml test-results/ingestion.xml
          | tee -a "$GITHUB_OUTPUT"

      # A fork can run the checks without access to an external gist. Keep
      # publishing optional while retaining all test results in this run.
      - name: Check test badge configuration
        id: badge
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        env:
          PACKPLATE_BADGE_TOKEN: ${{ secrets.GIST_SECRET }}
          PACKPLATE_BADGE_GIST_ID: ${{ vars.TEST_BADGE_GIST_ID }}
        run: |
          if [ -n "$PACKPLATE_BADGE_TOKEN" ] && [ -n "$PACKPLATE_BADGE_GIST_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Test badge publishing is not configured. See this run's test and coverage artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update test badge
        if: ${{ !cancelled() && steps.badge.outputs.configured == 'true' }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.TEST_BADGE_GIST_ID }}
          filename: packplate-tests.json
          label: tests
          message: ${{ steps.count.outputs.message }}
          color: ${{ steps.count.outputs.color }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj_3/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proj_3/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
