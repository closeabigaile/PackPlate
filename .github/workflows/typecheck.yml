# TypeScript type and syntax check for proj_2/frontend.
name: Typecheck

on:
  push:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/typecheck.yml"
  pull_request:
    paths:
      - "proj_2/frontend/**"
      - ".github/workflows/typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj_2/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proj_2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates Next's route types first, which a fresh checkout lacks.
      - name: Check
        run: npm run typecheck
