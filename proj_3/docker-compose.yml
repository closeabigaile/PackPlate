# Preserve the existing service and database-volume names after the directory rename.
name: proj_2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-packplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-packplate}
      POSTGRES_DB: ${POSTGRES_DB:-packplate}
    ports:
      # Host port; set POSTGRES_PORT in .env if 5432 is taken (e.g. a local Postgres).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this, so it can bring the database up to date on start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-packplate} -d ${POSTGRES_DB:-packplate}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .                     # proj_3/, so the image can include db/
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-packplate}:${POSTGRES_PASSWORD:-packplate}@db:5432/${POSTGRES_DB:-packplate}
      FRONTEND_ORIGIN: http://localhost:3000
      # The assistant's optional local model: Ollama on the host machine, if there
      # is one. Without it the assistant answers with its built-in rules.
      ASSISTANT_LLM_URL: ${ASSISTANT_LLM_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
